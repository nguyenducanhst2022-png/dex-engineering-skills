name: Validate DEX Skills

on:
  push:
    branches: [ main, master, feat/*, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validate 91 Agent Skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Skills Structure & Section Validator
        run: |
          python scripts/validate_skills.py

      - name: Run Pytest Suite (Structure & Dynamic Routing Matrix)
        run: |
          pytest tests/ -v
