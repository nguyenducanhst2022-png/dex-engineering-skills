name: DEX verification
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5
      - run: python -m pytest -q
      - run: python scripts/validate_skills.py
      - run: python scripts/audit_skills.py --export-v10
      - run: python scripts/evaluate_routing_v10.py
      - run: python scripts/polyglot/dex.py verify --skill dex-development-workflow
      - run: python scripts/polyglot/dex.py skills validate --format json
