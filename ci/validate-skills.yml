name: Validate DEX Skills

on:
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate DEX Engineering Skills Framework v5.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Validate Native Skills Specification (201 Native + 4 Integrations)
        run: |
          python scripts/validate_pack.py

      - name: Execute SkillOps Security Screening & Spec Audit
        run: |
          python scripts/audit_skills.py

      - name: Evaluate Dynamic Routing Precision & Recall (F1 >= 0.85)
        run: |
          python scripts/evaluate_routing.py

      - name: Run Pytest Test Suite (645 Tests)
        run: |
          pytest tests/ -v
